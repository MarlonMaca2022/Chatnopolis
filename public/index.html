<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatnopolis - Bienvenido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-brand-50 min-h-screen flex items-center justify-center font-sans text-slate-800">

    <div
        class="w-full max-w-lg p-8 bg-white/80 backdrop-blur-md rounded-2xl shadow-xl border border-white/50 transition-all duration-300 my-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-brand-900 mb-2">Chatnopolis</h1>
            <p class="text-slate-500">Un espacio tranquilo para conversar</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-slate-200 mb-6">
            <button id="tab-guest"
                class="flex-1 py-2 text-brand-600 border-b-2 border-brand-500 font-semibold focus:outline-none transition-colors">Invitado</button>
            <button id="tab-login"
                class="flex-1 py-2 text-slate-500 hover:text-brand-600 focus:outline-none transition-colors">Entrar</button>
            <button id="tab-register"
                class="flex-1 py-2 text-slate-500 hover:text-brand-600 focus:outline-none transition-colors">Registro</button>
        </div>

        <!-- Room Selector Area (Shared for Guest & Login) -->
        <div id="room-selector-container" class="mb-4">
            <label for="room-select" class="block text-sm font-medium text-slate-700 mb-1">Elige una Sala</label>
            <select id="room-select"
                class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white">
                <option value="general">General</option>
                <!-- Populated via JS -->
            </select>
        </div>

        <!-- Guest Form -->
        <form id="guest-form" class="space-y-6 block">
            <div>
                <label for="guest-username" class="block text-sm font-medium text-slate-700 mb-1">Tu Nick /
                    Apodo</label>
                <input type="text" id="guest-username" required placeholder="Ej: Viajero_Astral"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50 hover:bg-white">
            </div>
            <button type="submit"
                class="w-full py-3 px-4 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition duration-200 flex justify-center items-center gap-2">
                <span>Entrar como Invitado</span>
                <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>

        <!-- Login Form -->
        <form id="login-form" class="space-y-6 hidden">
            <div>
                <label for="login-username" class="block text-sm font-medium text-slate-700 mb-1">Nombre de
                    Usuario</label>
                <input type="text" id="login-username" placeholder="Tu usuario registrado"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50 hover:bg-white">
            </div>
            <div>
                <label for="login-password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input type="password" id="login-password" placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50 hover:bg-white">
            </div>
            <button type="submit"
                class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition duration-200">
                Iniciar Sesión
            </button>
        </form>

        <!-- Register Form (Enhanced) -->
        <form id="register-form" class="space-y-4 hidden">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="reg-name" class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo</label>
                    <input type="text" id="reg-name" required placeholder="Juan Pérez"
                        class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
                </div>
                <div>
                    <label for="reg-country" class="block text-sm font-medium text-slate-700 mb-1">País</label>
                    <input type="text" id="reg-country" required placeholder="Ej: México"
                        class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
                </div>
            </div>

            <div>
                <label for="reg-email" class="block text-sm font-medium text-slate-700 mb-1">Email
                    (Recuperación)</label>
                <input type="email" id="reg-email" required placeholder="juan@ejemplo.com"
                    class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
            </div>

            <div>
                <label for="reg-username" class="block text-sm font-medium text-slate-700 mb-1">Usuario (Nick)</label>
                <input type="text" id="reg-username" required placeholder="jperez2024"
                    class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="reg-password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="••••••••"
                        class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
                </div>
                <div>
                    <label for="reg-confirm-password"
                        class="block text-sm font-medium text-slate-700 mb-1">Confirmar</label>
                    <input type="password" id="reg-confirm-password" required placeholder="••••••••"
                        class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-slate-50">
                </div>
            </div>

            <button type="submit"
                class="w-full py-3 px-4 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition duration-200 mt-2">
                Crear Cuenta
            </button>
        </form>

        <div id="error-msg"
            class="mt-4 text-center text-sm text-red-500 hidden bg-red-50 p-2 rounded-lg border border-red-200"></div>
    </div>

    <script src="js/auth.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>

</html>
