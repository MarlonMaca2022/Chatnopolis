<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El servidor reemplaza todo este bloque por las etiquetas propias de cada
         página: título, descripción, canonical, vista previa para redes y, solo
         en /chat, las de contenido adulto (ver server/seo.js). Lo de adentro es
         lo que se ve en desarrollo, donde el HTML lo sirve Vite. -->
    <!--seo-->
    <title>Chatnopolis</title>
    <meta name="description" content="Chat en español gratis y sin registro. Solo para mayores de 18 años." />
    <!--/seo-->
    <!-- Íconos: el fantasmita de public/favicon.svg; los PNG/ICO salen de él (ver CLAUDE.md, Marca). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#edf2f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10201f" media="(prefers-color-scheme: dark)" />
    <!-- Tema antes del primer pintado. Es un script clásico (no module) para que
         bloquee el render y no haya flash blanco. Ver public/theme-init.js. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
