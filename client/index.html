<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatnopolis</title>
    <meta
      name="description"
      content="Chat en tiempo real con salas y mensajes privados. Solo para mayores de 18 años."
    />
    <!-- Marcadores de contenido adulto: es lo que leen los filtros de control
         parental para bloquear el sitio en el equipo de un menor. Si algún día
         se prohíbe el contenido explícito, hay que sacar estas dos líneas. -->
    <meta name="rating" content="adult" />
    <meta name="RATING" content="RTA-5042-1996-1400-1577-RTA" />
    <!-- Íconos: salen de los trazados de src/components/Logo.jsx (ver CLAUDE.md, Marca). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#edf2f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10201f" media="(prefers-color-scheme: dark)" />
    <!-- Tema antes del primer pintado. Es un script clásico (no module) para que
         bloquee el render y no haya flash blanco. Ver public/theme-init.js. -->
    <script src="/theme-init.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
